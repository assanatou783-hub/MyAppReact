services:
  mongodb:
    image: mongo
    networks:
      - mern-network

  server:
    build: ./Server
    ports:
      - "9000:9000"
    depends_on:
      - mongodb
    environment:
      MONGO_URI: mongodb://mongodb:27017/mern_db
    networks:
      - mern-network

  client:
    build: ./Client
    ports:
      - "3000:3000"
    depends_on:
      - server
    networks:
      - mern-network

networks:
  mern-network:
    driver: bridge